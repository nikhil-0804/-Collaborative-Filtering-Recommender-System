<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: black;
            color: white;
        }
        /* Premium Navigation Bar Styling */
        .navbar {
            background: #56a883;
            border-radius: 0;
            border: none;
            margin-bottom: 30px;
        }
        .navbar-brand {
            color: white !important;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 20px;
        }
        .nav li a {
            color: rgba(255,255,255,0.9) !important;
            transition: all 0.3s ease;
            font-weight: 500;
            padding: 15px 20px;
        }
        .nav li a:hover {
            color: white !important;
            transform: translateY(-2px);
            background: transparent !important;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(86, 168, 131, 0.2);
        }
        .card-img-top {
            height: 300px;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
        }
        .card-body {
            padding: 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand">My Book Recommender</a>
            </div>
            <ul class="nav navbar-nav">
                <li><a href="/">Home</a></li>
                <li><a href="/recommend">Recommend by Book</a></li>
                <li><a href="/author">Recommend by Author</a></li>
                <li><a href="/genres">Recommend by Genre</a></li>
                <li><a href="{{ url_for('audiobooks.audiobooks') }}">Premium</a></li>
                <li><a>Contact</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h1 class="text-center" style="font-size: 2.5rem; margin-bottom: 40px; color: #56a883">
                    Top 50 Books
                </h1>
            </div>

            {% for i in range(book_name|length) %}
                <div class="col-md-3" style="margin-top: 30px; margin-bottom: 30px">
                    <div class="card">
                        <div class="card-body">
                            <img class="card-img-top" src="{{ image[i] }}" 
                                 onerror="this.src='https://via.placeholder.com/300x400/1a1a1a/56a883?text=Cover+Not+Available'">
                            <h4 class="text-white" style="margin-top: 15px">{{ book_name[i] }}</h4>
                            <p class="text-muted">{{ author[i] }}</p>
                            <div style="border-top: 1px solid #2a2a2a; padding-top: 10px">
                                <small class="text-muted">Votes: {{ votes[i] }}</small><br>
                                <small class="text-muted">Rating: {{ rating[i] }}</small>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

</body>
</html>
