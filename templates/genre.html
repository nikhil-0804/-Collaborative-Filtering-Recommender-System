<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Recommender System - Genre</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">
    <style>
        .text-white { 
            color: white; 
        }
        .book-card { 
            background: #222;
            padding: 15px; 
            margin: 10px; 
            border-radius: 5px; 
            transition: transform 0.3s; 
        }
        .book-card:hover { 
            transform: translateY(-5px); 
        }
        .book-card img { 
            height: 200px; 
            object-fit: cover; 
            width: 100%; }
        #genreDropdown { 
            margin: 20px 0; 
        }
        .search-btn { 
            background-color: #00a65a; 
            border: none; 
            margin-top: 15px; 
        }
        .search-btn:hover { 
            background-color: #008f4c; 
        }
        .loading-text { 
            color: #00a65a; 
            font-size: 18px; 
            text-align: center; }
        .navbar {
            background: #56a883;
            border-radius: 0;
            border: none;
            margin-bottom: 30px;
        }
        .navbar-brand {
            color: white !important;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 20px;
        }
        .nav li a {
            color: rgba(255,255,255,0.9) !important;
            transition: all 0.3s ease;
            font-weight: 500;
            padding: 15px 20px;
        }
        .nav li a:hover {
            color: white !important;
            transform: translateY(-2px);
            background: transparent !important;
        }
    </style>
</head>
<body style="background-color: black">

    <nav class="navbar">
        <div class="container">
            <div class="navbar-header">
                <a class="navbar-brand">My Book Recommender</a>
            </div>
            <ul class="nav navbar-nav">
                <li><a href="/">Home</a></li>
                <li><a href="/recommend">Recommend by Book</a></li>
                <li><a href="/author">Recommend by Author</a></li>
                <li><a href="/genres">Recommend by Genre</a></li>
                <li><a href="{{ url_for('audiobooks.audiobooks') }}">Premium</a></li>
                <li><a>Contact</a></li>
            </ul>
        </div>
    </nav>

<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h1 class="text-white" style="font-size: 50px; margin-top: 30px">Browse by Genre</h1>
            
            <!-- Genre Selection -->
            <div class="form-group">
                <select id="genreDropdown" class="form-control">
                    <option value="">Select a Genre</option>
                    <option value="adventure">Adventure</option>
                    <option value="fantasy">Fantasy</option>
                    <option value="romance">Romance</option>
                    <option value="mystery">Mystery</option>
                    <option value="science fiction">Science Fiction</option>
                    <option value="horror">Horror</option>
                    <option value="nonfiction">Non-Fiction</option>
                    <option value="thriller">Thriller</option>
                    <option value="history">History</option>
                    <option value="biography">Biography</option>
                </select>
                <button id="searchButton" class="btn btn-lg btn-block search-btn">
                    <i class="glyphicon glyphicon-search"></i> Search Books
                </button>
            </div>

            <!-- Book Results -->
            <div id="bookResults" class="row" style="margin-top: 20px;"></div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    $('#searchButton').click(function() {
        const genre = $('#genreDropdown').val();
        if (genre) {
            $('#bookResults').html('<p class="loading-text">Loading books...</p>');
            
            $.ajax({
                url: '/get_books?genre=' + genre,
                type: 'GET',
                success: function(data) {
                    let html = '';
                    if(data.length > 0) {
                        data.forEach(book => {
                            html += `
                                <div class="col-md-3">
                                    <div class="book-card">
                                        <img src="${book['Image-URL-M'] || 'https://via.placeholder.com/150x200?text=No+Image'}" 
                                             class="img-responsive" 
                                             alt="${book['Book-Title']}">
                                        <h4 class="text-white">${book['Book-Title']}</h4>
                                        <p class="text-white">By ${book['Book-Author']}</p>
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        html = '<p class="text-white">No books found for this genre</p>';
                    }
                    $('#bookResults').html(html);
                },
                error: function() {
                    $('#bookResults').html('<p class="text-white">Error loading books. Please try again.</p>');
                }
            });
        } else {
            $('#bookResults').html('<p class="text-white">Please select a genre first</p>');
        }
    });
});
</script>

</body>
</html>
